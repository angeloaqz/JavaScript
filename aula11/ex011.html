<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidadania</title>
</head>
<body>
    <h1>Sistema de Cidadania</h1>
    <p>Pais de Nascimento: <input type="text" name="txtpais" id="txtpais"></p>
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res"></div>
    <script>
        var txtp = window.document.querySelector('input#txtpais')
        function verificar() {
            var res = window.document.querySelector('div#res')
            var pais = txtp.value
            res.innerHTML = `<p>O pais de nascimento é <strong>${pais}</strong></p>`
            if (pais == "Brasil") {
                res.innerHTML += `<p>Você é <strong>brasileiro</strong>!</p>`
            }
            else if(pais == "brasil") {
                res.innerHTML += `<p>Você é <strong>brasileiro</strong>!</p>`
            }
            else {
                res.innerHTML += `<p>Você é <strong>estrangeiro</strong>!</p>`
            }
        }
    </script>
</body>
</html>
